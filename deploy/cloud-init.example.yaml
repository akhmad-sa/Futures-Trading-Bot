#cloud-config
# Oracle Cloud / cloud-init example for Futures Trading Bot
# Replace YOUR_GIT_REPO_URL and YOUR_SSH_PUBLIC_KEY before use.

package_update: true
package_upgrade: true
timezone: UTC

packages:
  - git
  - curl
  - ufw
  - python3.12
  - python3.12-venv
  - build-essential

users:
  - name: ubuntu
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - YOUR_SSH_PUBLIC_KEY

runcmd:
  - [ bash, -lc, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ bash, -lc, "ufw allow OpenSSH && ufw --force enable" ]
  - [ bash, -lc, "sudo -u ubuntu git clone YOUR_GIT_REPO_URL /home/ubuntu/futures-trading-bot || true" ]
  - [ bash, -lc, "cd /home/ubuntu/futures-trading-bot && python3.12 -m venv venv && ./venv/bin/pip install -U pip && ./venv/bin/pip install -r requirements.txt" ]
  - [ bash, -lc, "sudo -u ubuntu mkdir -p /home/ubuntu/futures-trading-bot/{data/candles,logs,storage}" ]
  - [ bash, -lc, "cd /home/ubuntu/futures-trading-bot && [ -f .env ] || cp .env.example .env" ]
