#cloud-config
# Futures Trading Bot — Oracle Cloud (Ubuntu 24.04 aarch64)
# Paste: Compute → Instance → Advanced → Initialization script
#
# Layout: user fbot, app /opt/futures-trading-bot (not /root)

hostname: futures-trading-bot
timezone: UTC
package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - ca-certificates
  - ufw

runcmd:
  - [ bash, -lc, "curl -fsSL https://raw.githubusercontent.com/akhmad-sa/Futures-Trading-Bot/main/deploy/oracle-init.sh -o /tmp/ftb-init.sh && chmod +x /tmp/ftb-init.sh && /tmp/ftb-init.sh" ]

final_message: |
  Futures Trading Bot init started.
  SSH: ssh ubuntu@<ip>  (or your admin user)
  cat /opt/futures-trading-bot/deploy/SETUP-NOTES.txt
  tail -f /var/log/futures-trading-bot/init.log
